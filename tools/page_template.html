<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="{{DESCRIPTION}}">
<title>{{TITLE}}</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    --paper:      #F3F5F1;
    --surface:    #FBFCFA;
    --ink:        #1A1D19;
    --ink-soft:   #4E554B;
    --ink-faint:  #7C8478;
    --rule:       #DCE0D6;
    --accent:     #5F8A1B;
    --accent-dim: #EBF1DF;
    --code-bg:    #ECEFE7;
    --warn:       #9A5B00;
    --warn-dim:   #FBF0DC;
    --shadow:     0 1px 2px rgba(26,29,25,.05), 0 8px 24px -16px rgba(26,29,25,.28);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper:      #131612;
      --surface:    #1B1F19;
      --ink:        #E9EDE4;
      --ink-soft:   #AFB8A8;
      --ink-faint:  #7E8777;
      --rule:       #2C3228;
      --accent:     #A6CE39;
      --accent-dim: #232A19;
      --code-bg:    #202619;
      --warn:       #F0B45A;
      --warn-dim:   #2E2413;
      --shadow:     0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
    }
  }
  :root[data-theme="dark"] {
    --paper:      #131612;
    --surface:    #1B1F19;
    --ink:        #E9EDE4;
    --ink-soft:   #AFB8A8;
    --ink-faint:  #7E8777;
    --rule:       #2C3228;
    --accent:     #A6CE39;
    --accent-dim: #232A19;
    --code-bg:    #202619;
    --warn:       #F0B45A;
    --warn-dim:   #2E2413;
    --shadow:     0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 62rem;
    margin: 0 auto;
    padding: clamp(2rem, 5vw, 4.5rem) clamp(1.1rem, 4vw, 2.5rem) 5rem;
  }

  .masthead { border-bottom: 2px solid var(--ink); padding-bottom: 1.6rem; }

  .eyebrow {
    font-size: .72rem;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-weight: 500;
    margin: 0 0 1rem;
  }

  h1 {
    font-family: Newsreader, Georgia, serif;
    font-weight: 500;
    font-size: clamp(2.6rem, 7vw, 4.4rem);
    line-height: 1.02;
    letter-spacing: -.02em;
    margin: 0;
    text-wrap: balance;
  }

  .standfirst {
    font-family: Newsreader, Georgia, serif;
    font-size: clamp(1.15rem, 2.4vw, 1.5rem);
    line-height: 1.45;
    color: var(--ink-soft);
    max-width: 40ch;
    margin: 1.1rem 0 0;
  }

  .meta {
    display: flex;
    flex-wrap: wrap;
    gap: .5rem 1.4rem;
    margin-top: 1.6rem;
    font-size: .82rem;
    color: var(--ink-faint);
  }
  .meta b { color: var(--ink-soft); font-weight: 500; }

  code {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: .86em;
    background: var(--code-bg);
    padding: .12em .38em;
    border-radius: 2px;
    color: var(--ink);
  }

  .close {
    margin-top: 3.6rem;
    padding-top: 1.6rem;
    border-top: 2px solid var(--ink);
    font-size: .88rem;
    color: var(--ink-faint);
    max-width: 66ch;
  }
  .close b { color: var(--ink-soft); font-weight: 500; }

  a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 2px; }
  a:focus-visible, :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ── the walkthrough ─────────────────────────────────── */
  .steps { counter-reset: step; margin-top: 2.2rem; display: grid; gap: 1.1rem; }

  .step {
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 3px;
    padding: 1.3rem 1.5rem 1.4rem 3.6rem;
    position: relative;
    box-shadow: var(--shadow);
  }
  .step::before {
    counter-increment: step;
    content: counter(step);
    position: absolute;
    left: 1.25rem; top: 1.3rem;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: .8rem;
    font-weight: 500;
    color: var(--accent);
    background: var(--accent-dim);
    width: 1.6rem; height: 1.6rem;
    display: grid; place-items: center;
    border-radius: 50%;
  }
  .step h2 {
    font-family: "IBM Plex Sans", ui-sans-serif, sans-serif;
    font-size: 1.05rem;
    font-weight: 600;
    letter-spacing: -.005em;
    margin: 0 0 .15rem;
  }
  .step p { margin: 0; color: var(--ink-soft); font-size: .94rem; max-width: 62ch; }
  .step p + p { margin-top: .55rem; }

  .where {
    display: block;
    font-size: .7rem;
    letter-spacing: .09em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-weight: 500;
    margin: 0 0 .6rem;
  }

  .seq {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: .45rem .5rem;
    margin: .1rem 0 .75rem;
  }
  .type {
    display: inline-flex;
    align-items: baseline;
    gap: .55rem;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: .88rem;
    background: var(--code-bg);
    border: 1px solid var(--rule);
    border-radius: 3px;
    padding: .4rem .75rem;
    color: var(--ink);
  }
  .type b {
    font-family: "IBM Plex Sans", ui-sans-serif, sans-serif;
    font-weight: 500;
    font-size: .7rem;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }
  .then { font-size: .8rem; color: var(--ink-faint); }

  .watch {
    margin-top: .7rem;
    padding-left: .85rem;
    border-left: 2px solid var(--rule);
    font-size: .89rem;
    color: var(--ink-faint);
  }
  .watch b { color: var(--ink-soft); font-weight: 500; }

  .warn {
    margin-top: .75rem;
    padding: .6rem .85rem;
    background: var(--warn-dim);
    border-left: 3px solid var(--warn);
    border-radius: 2px;
    font-size: .91rem;
    color: var(--ink);
    max-width: 62ch;
  }
  .warn b { color: var(--warn); font-weight: 600; }

  .first { border-left: 3px solid var(--accent); }

  .callout {
    margin: 2.4rem 0 0;
    padding: 1.3rem 1.5rem;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-left: 3px solid var(--accent);
    border-radius: 3px;
    box-shadow: var(--shadow);
  }
  .callout h2 { font-family: "IBM Plex Sans", ui-sans-serif, sans-serif;
                font-size: 1rem; font-weight: 600; margin: 0 0 .5rem; }
  .callout p { margin: 0; color: var(--ink-soft); font-size: .94rem; max-width: 64ch; }
  .callout p + p { margin-top: .55rem; }

  .places {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(17rem, 1fr));
    gap: .9rem;
    margin-top: .9rem;
  }
  .place {
    border: 1px solid var(--rule);
    border-radius: 3px;
    padding: .85rem 1rem;
    background: var(--paper);
  }
  .place h3 { font-size: .9rem; font-weight: 600; margin: 0 0 .45rem; }
  .place p { font-size: .88rem; }
  .prompt {
    display: block;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: .8rem;
    background: var(--code-bg);
    border-radius: 2px;
    padding: .45rem .6rem;
    margin: 0 0 .55rem;
    overflow-x: auto;
    white-space: nowrap;
    color: var(--ink);
  }

  /* spacing that used to be written inline */
  .callout p.after-places { margin-top: .9rem; }
  .step p + .seq { margin-top: .6rem; }
</style>
</head>
<body>
<div class="wrap">
{{CONTENT}}
</div>
</body>
</html>
